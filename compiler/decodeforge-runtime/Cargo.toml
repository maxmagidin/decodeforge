[package]
name = "decodeforge-runtime"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Guarded ownership, validation, loading, and execution for generated DecodeForge modules."

[lib]
path = "src/lib.rs"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "=0.2.189"
libloading = "=0.9.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"
