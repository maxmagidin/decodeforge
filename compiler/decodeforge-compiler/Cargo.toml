[package]
name = "decodeforge-compiler"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Typed Q8 IR, OI4 packing, scalar/NEON code generation, and native artifact audits."

[lib]
path = "src/lib.rs"

[dependencies]
decodeforge-core = { path = "../decodeforge-core" }
decodeforge-runtime = { path = "../decodeforge-runtime" }
memmap2 = "=0.9.9"
object = { version = "=0.40.0", default-features = false, features = ["macho", "read_core", "std"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
safetensors = "=0.8.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"
