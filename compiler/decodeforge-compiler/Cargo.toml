[package]
name = "decodeforge-compiler"
version = "0.1.0"
edition = "2024"
publish = false
description = "DecodeForge G1 target-independent IR and deterministic Q8 packing."

[lib]
path = "src/lib.rs"

[dependencies]
decodeforge-core = { path = "../decodeforge-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
